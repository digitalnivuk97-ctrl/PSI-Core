services:
  web:
    build:
      context: ${PORTABLE_CORE_SOURCE_DIR:-../..}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:?set NEXT_PUBLIC_CONVEX_URL to the browser-facing Convex URL}
    restart: unless-stopped
    ports:
      - "${PORTABLE_CORE_PORT:-8080}:3000"
    environment:
      PORTABLE_CORE_DATA_DIR: /data
      PORTABLE_CORE_REQUIRE_CONVEX: ${PORTABLE_CORE_REQUIRE_CONVEX:-true}
      PORTABLE_CORE_SETUP_TOKEN: ${PORTABLE_CORE_SETUP_TOKEN:?set PORTABLE_CORE_SETUP_TOKEN before first setup}
      PORTABLE_CORE_REQUIRE_HTTPS: ${PORTABLE_CORE_REQUIRE_HTTPS:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CONVEX_SELF_HOSTED_URL: ${CONVEX_SELF_HOSTED_URL:?set CONVEX_SELF_HOSTED_URL}
      CONVEX_INTERNAL_KEY: ${CONVEX_INTERNAL_KEY:?set CONVEX_INTERNAL_KEY}
    volumes:
      - portable-core-data:/data
    depends_on:
      backend:
        condition: service_healthy
        required: false
      convex-deploy:
        condition: service_completed_successfully
        required: false
  backend:
    profiles: ["self-hosted"]
    image: ${CONVEX_BACKEND_IMAGE:-}
    command: []
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${CONVEX_BIND_ADDRESS:-127.0.0.1}:${CONVEX_BACKEND_PORT:-3210}:3210"
    environment:
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      DO_NOT_REQUIRE_SSL: ${CONVEX_DO_NOT_REQUIRE_SSL:-true}
      DISABLE_BEACON: "true"
      INSTANCE_NAME: ${INSTANCE_NAME:-portable-core}
      INSTANCE_SECRET: ${INSTANCE_SECRET:-}
    volumes:
      - convex-data:/convex/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 20
  convex-keygen:
    profiles: ["self-hosted"]
    image: ${CONVEX_BACKEND_IMAGE:-}
    working_dir: /convex
    restart: "no"
    command: ["sh", "-c", "umask 077; ./generate_admin_key.sh > /secrets/convex-admin-key"]
    environment:
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      INSTANCE_NAME: ${INSTANCE_NAME:-portable-core}
      INSTANCE_SECRET: ${INSTANCE_SECRET:-}
    volumes:
      - convex-secrets:/secrets
    depends_on:
      backend:
        condition: service_healthy
  convex-deploy:
    profiles: ["self-hosted"]
    build:
      context: ${PORTABLE_CORE_SOURCE_DIR:-../..}
      dockerfile: Dockerfile
      target: convex-deploy
    restart: "no"
    environment:
      CONVEX_SELF_HOSTED_URL: ${CONVEX_SELF_HOSTED_URL:-http://backend:3210}
      CONVEX_INTERNAL_KEY: ${CONVEX_INTERNAL_KEY:-}
      PORTABLE_CORE_SETUP_TOKEN: ${PORTABLE_CORE_SETUP_TOKEN:?set PORTABLE_CORE_SETUP_TOKEN before first setup}
    volumes:
      - convex-secrets:/secrets:ro
    depends_on:
      convex-keygen:
        condition: service_completed_successfully
  dashboard:
    profiles: ["self-hosted"]
    image: ${CONVEX_DASHBOARD_IMAGE:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://backend:3210
    depends_on:
      backend:
        condition: service_healthy
volumes:
  portable-core-data:
  convex-data:
  convex-secrets:
