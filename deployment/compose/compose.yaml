services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "${PORTABLE_CORE_PORT:-8080}:3000"
    environment:
      PORTABLE_CORE_DATA_DIR: /data
      NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:-}
      CONVEX_SELF_HOSTED_URL: ${CONVEX_SELF_HOSTED_URL:-}
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
    volumes:
      - portable-core-data:/data
    depends_on:
      backend:
        condition: service_healthy
  backend:
    image: ${CONVEX_BACKEND_IMAGE:-ghcr.io/get-convex/convex-backend:latest}
    command: []
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    environment:
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      DO_NOT_REQUIRE_SSL: "true"
      DISABLE_BEACON: "true"
      INSTANCE_NAME: ${INSTANCE_NAME:-portable-core}
      INSTANCE_SECRET: ${INSTANCE_SECRET:?set INSTANCE_SECRET in .portable-core/runtime/secrets.env}
    volumes:
      - convex-data:/convex/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 20
  dashboard:
    image: ${CONVEX_DASHBOARD_IMAGE:-ghcr.io/get-convex/convex-dashboard:latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://backend:3210
    depends_on:
      backend:
        condition: service_healthy
volumes:
  portable-core-data:
  convex-data:
